[build]
  publish = "."

# Keep links from the old WordPress.com site working
[[redirects]]
  from = "/about-2/*"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/2026/11/15/mali-empire-mansa-musa-gold-trade/*"
  to = "/stories/mali-empire-mansa-musa-gold-trade/"
  status = 301

[[redirects]]
  from = "/2026/11/15/hello-world/*"
  to = "/stories/"
  status = 301

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
